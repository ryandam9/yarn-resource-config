# Tool settings for scripts/yarn_spark_settings.py.
# The script runs on Python 3.6+ (old EMR images): the type hints use the typing module, and
# `vermin --target=3.6- scripts/yarn_spark_settings.py` checks that nothing newer is used.

[tool.ruff]
line-length = 120
target-version = "py37"  # the oldest version ruff knows; the script itself also runs on 3.6
include = ["scripts/yarn_spark_settings.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "ANN"]  # ANN: every function has type hints
ignore = [
    "UP031",  # %-formatting is the style of the whole script; f-strings would only churn it
    "UP022",  # capture_output= does not exist in Python 3.6, so keep stdout=/stderr=PIPE
    "UP036",  # the "needs Python 3.6" check is deliberate: it gives a clear message on old Pythons
    "ANN401",  # Any is right for JSON answers from the REST APIs
]

[tool.ty.environment]
python-version = "3.7"  # the oldest version ty knows; vermin covers 3.6

[tool.ty.src]
include = ["scripts/yarn_spark_settings.py"]
